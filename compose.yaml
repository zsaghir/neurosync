name: neurosync

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurosync}
      POSTGRES_USER: ${POSTGRES_USER:-neurosync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-neurosync}:${POSTGRES_PASSWORD:-neurosync}@database:5432/${POSTGRES_DB:-neurosync}?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-neurosync}:${POSTGRES_PASSWORD:-neurosync}@database:5432/${POSTGRES_DB:-neurosync}?sslmode=disable
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-5m}
      DB_STARTUP_TIMEOUT: ${DB_STARTUP_TIMEOUT:-10s}
      DB_READINESS_TIMEOUT: ${DB_READINESS_TIMEOUT:-2s}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start -- --lan
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      EXPO_PUBLIC_CLERK_GOOGLE_WEB_CLIENT_ID: ${EXPO_PUBLIC_CLERK_GOOGLE_WEB_CLIENT_ID:-}
      EXPO_PUBLIC_CLERK_GOOGLE_ANDROID_CLIENT_ID: ${EXPO_PUBLIC_CLERK_GOOGLE_ANDROID_CLIENT_ID:-}
      EXPO_PUBLIC_CLERK_GOOGLE_IOS_CLIENT_ID: ${EXPO_PUBLIC_CLERK_GOOGLE_IOS_CLIENT_ID:-}
      EXPO_PUBLIC_CLERK_GOOGLE_IOS_URL_SCHEME: ${EXPO_PUBLIC_CLERK_GOOGLE_IOS_URL_SCHEME:-}
    ports:
      - "${EXPO_PORT:-8081}:8081"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
